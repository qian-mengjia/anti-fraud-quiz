<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>智识反诈</title>
    <link rel="stylesheet" href="/styles.css">
    <script defer src="/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="brandbar">
        <div class="brand">
          <img class="logo" src="/logo.jpg" alt="计算机学院 logo">
          <div class="brandCopy">
            <p class="kicker">计算机学院 · 团日活动</p>
            <h1>智识反诈</h1>
            <p class="subcopy">15 题通关 · 每题 15 秒 · 答对 +1 分</p>
          </div>
        </div>
        <div class="badges">
          <span class="badge">扫码参与</span>
          <span class="badge">实时排名</span>
        </div>
      </header>

      <section class="content">
        <main class="stage">
          <section class="panel lobby" id="lobbyPanel">
            <div class="panelHead">
              <div>
                <p class="panelTag">加入战场</p>
                <h2>先扫二维码，或直接输入昵称</h2>
              </div>
              <button class="ghostButton" id="resetLocalButton" type="button">退出并重新加入</button>
            </div>

            <div class="lobbyGrid">
              <div class="joinBox" id="joinBox">
                <form class="joinForm" id="joinForm">
                  <label class="field">
                    <span>昵称</span>
                    <input id="nameInput" maxlength="16" placeholder="例如：阿宇" autocomplete="nickname">
                  </label>
                  <button class="primaryButton" type="submit">加入答题场</button>
                </form>
                <p class="joinHint" id="joinHint">答完会自动跳下一题，超时也会自动进入下一题。</p>
              </div>

              <div class="shareBox">
                <img id="qrImage" class="qrImage" alt="扫码加入二维码">
                <div class="shareMeta">
                  <p>扫码加入同一场</p>
                  <code id="shareLink" class="shareLink"></code>
                </div>
              </div>
            </div>

            <div class="joinedBar hidden" id="joinedBar">
              <span id="joinedName"></span>
              <span class="joinedDot">●</span>
              <span id="joinedScore">0 分</span>
            </div>
          </section>

          <section class="panel waiting hidden" id="waitingPanel">
            <div class="waitingStage">
              <div class="waitingMascot">⌛</div>
              <p class="panelTag">已加入本局</p>
              <h2 id="waitingName">同学</h2>
              <p id="waitingStatus">等待管理员点击“开始游戏”</p>
              <div class="sharedCountdown">
                <span>统一倒计时</span>
                <strong id="waitingCountdown">—</strong>
                <small>秒</small>
              </div>
              <p class="waitingNote">请保持页面打开。管理员开始后，所有同学会同时进入答题。</p>
              <button class="ghostButton" id="waitingLeaveButton" type="button">退出并重新加入</button>
            </div>
          </section>

          <section class="panel game hidden" id="gamePanel">
            <div class="gameTop">
              <div>
                <p class="panelTag">闯关中</p>
                <h2 id="questionCounter">第 1 题 / 共 15 题</h2>
              </div>
              <div class="timerWrap">
                <div class="timerRing" id="timerRing">
                  <span id="timerText">15.0</span>
                </div>
              </div>
            </div>

            <div class="progressBar">
              <div class="progressFill" id="progressFill"></div>
            </div>

            <div class="questionCard" id="questionCard">
              <p class="questionPrompt" id="questionPrompt"></p>
              <div class="options" id="options"></div>
            </div>

            <div class="feedback" id="feedback"></div>
          </section>

          <section class="panel result hidden" id="resultPanel">
            <div class="panelHead">
              <div>
                <p class="panelTag">通关结果</p>
                <h2 id="resultTitle">完成挑战</h2>
              </div>
            </div>
            <div class="resultGrid">
              <div class="resultMetric">
                <span>得分</span>
                <strong id="resultScore">0</strong>
              </div>
              <div class="resultMetric">
                <span>名次</span>
                <strong id="resultRank">-</strong>
              </div>
              <div class="resultMetric">
                <span>正确率</span>
                <strong id="resultRate">0%</strong>
              </div>
            </div>
            <p class="resultNote" id="resultNote"></p>
          </section>
        </main>

        <aside class="panel sidebar">
          <div class="panelHead">
            <div>
              <p class="panelTag">实时排名</p>
              <h2>半透明榜单</h2>
            </div>
          </div>
          <ol class="leaderboard" id="leaderboard"></ol>
        </aside>
      </section>
    </div>
  </body>
</html>
